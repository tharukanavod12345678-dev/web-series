name: Series Downloader → Release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs (one per line). ඕන නම් විතරයි — urls.txt fallback'
        required: false
        type: string
  push:
    paths:
      - 'urls.txt'

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg + aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2

      - name: Install yt-dlp + python deps
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          pip install -r requirements.txt

      - name: Write URLs from input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.urls != ''
        run: |
          cat > urls.txt <<'EOF'
          ${{ github.event.inputs.urls }}
          EOF

      - name: Download
        run: python download.py

      - name: List downloads
        if: always()
        run: |
          echo "=== downloaded ==="
          find downloads -type f -printf "%s\t%p\n" 2>/dev/null | sort -nr || true
          du -sh downloads/ 2>/dev/null || true

      - name: Create Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          name: "Series run #${{ github.run_number }}"
          body: |
            Automated download — run #${{ github.run_number }}
            Date: ${{ github.event.repository.updated_at }}
          files: downloads/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
