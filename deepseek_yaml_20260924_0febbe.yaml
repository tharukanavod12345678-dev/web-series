name: Series Downloader → Telegram

on:
  workflow_dispatch:
  push:
    paths:
      - 'urls.txt'

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg + aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2

      - name: Install yt-dlp + python deps
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          pip install -r requirements.txt

      - name: Download
        run: python download.py

      - name: List downloads
        if: always()
        run: |
          echo "=== downloaded ==="
          find downloads -type f -printf "%s\t%p\n" 2>/dev/null | sort -nr || true
          du -sh downloads/ 2>/dev/null || true

      - name: Upload to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets missing — skipping upload."
            exit 0
          fi

          shopt -s nullglob
          files=(downloads/*.{mp4,mkv,webm,avi})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No videos to upload."
            exit 0
          fi

          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            name=$(basename "$f")
            echo "→ $name  ($((size/1024/1024)) MB)"

            if [ "$size" -gt 1900000000 ]; then
              echo "  too large for bot API (2GB), skipping"
              continue
            fi

            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${f}" \
              -F "caption=${name}" \
              -F "supports_streaming=true" \
              --max-time 1800 \
              -o /tmp/tg.json || true

            if grep -q '"ok":true' /tmp/tg.json 2>/dev/null; then
              echo "  uploaded ✓"
            else
              echo "  failed:"
              cat /tmp/tg.json 2>/dev/null || true
            fi
          done

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: downloads/
          retention-days: 3
          if-no-files-found: warn
          compression-level: 0